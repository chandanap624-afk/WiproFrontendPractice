<!DOCTYPE html>
<html>
<head>
    <title>Products Price Calculation</title>
</head>
<body>

<h2>Products Price Calculation</h2>

<script>

const products = [
    { name: "Mobile", price: 16000 },
    { name: "Laptop", price: 55000 },
    { name: "TV", price: 30000 },
    { name: "Headphones", price: 5000 },
    { name: "Washing Machine", price: 25000 }
];

// Display original products
products.forEach(p => {
    document.writeln(p.name + " : " + p.price + "<br>");
});

document.writeln("<br>");

// Total before discount
const totalBeforeDiscount = products.reduce((sum, p) => sum + p.price, 0);
document.writeln("Total Before Discount: " + totalBeforeDiscount + "<br><br>");

// Apply discount
const discountedProducts = products.map(p => ({
    name: p.name,
    price: p.price - (p.price * 0.10)
}));

document.writeln("Discounted Products:<br>");
discountedProducts.forEach(p => {
    document.writeln(p.name + " : " + p.price + "<br>");
});

document.writeln("<br>");

// Total after discount
const totalAfterDiscount = discountedProducts.reduce((sum, p) => sum + p.price, 0);
document.writeln("Total After Discount: " + totalAfterDiscount + "<br><br>");

// Filter products > 10000
const filteredProducts = discountedProducts.filter(p => p.price > 10000);

document.writeln("Products greater than 10000 after discount:<br>");
filteredProducts.forEach(p => {
    document.writeln(p.name + " : " + p.price + "<br>");
});

document.writeln("<br>");

// Total filtered price
const totalFilteredPrice = filteredProducts.reduce((sum, p) => sum + p.price, 0);
document.writeln("Total Price of filtered products: " + totalFilteredPrice);

</script>

</body>
</html>
