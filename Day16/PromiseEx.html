<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promise Fetch JSON Example</title>
</head>
<body>

<div id="output"></div>

<script>
const myPromise = new Promise((resolve, reject) => {

    setTimeout(() => {

        fetch('https://jsonplaceholder.typicode.com/users')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                return response.json();
            })
            .then(data => {
                resolve(data);
            })
            .catch(error => {
                reject(error.message);
            });

    }, 5000);
});

console.log("Fetching data... taking some time, meanwhile this code is running");

for (let i = 0; i <= 3; i++) {
    console.log("Performing some other task while fetching data", i);
}

myPromise
    .then(users => {
        let result = "<h2>Users Data received from API:</h2>";

        users.forEach(u => {
            result += `<p>${u.name}</p>`;
        });

        document.getElementById("output").innerHTML = result;
    })
    .catch(error => {
        document.getElementById("output").innerHTML = `<p>${error}</p>`;
    });
</script>

</body>
</html>
