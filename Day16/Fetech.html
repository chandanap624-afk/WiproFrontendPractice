<!DOCTYPE html>
<html>
<head>
    <title>Fetch JSON Example</title>
</head>
<body>

<h3>Users Data in JSON</h3>
<ul id="users"></ul>

<script>
    // Fetch JSON data from API
    fetch('https://jsonplaceholder.typicode.com/users')   // ✅ corrected URL
    
    // Convert response to JSON
    .then(response => response.json())
    
    // Process and display data
    .then(data => {
        const ul = document.getElementById("users");

        data.forEach(user => {
            const li = document.createElement("li");

            li.textContent = `User Name: ${user.username} - Email: ${user.email}`;

            ul.append(li);
        });
    })

    // Error handling
    .catch(err => console.error("Error while loading the data", err));
</script>

</body>
</html>
