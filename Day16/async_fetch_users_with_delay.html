<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Await Fetch Example</title>
</head>
<body>

<h2>Users Data</h2>
<div id="output"></div>

<script>
    async function fetchUsers() {
        try {
            // Simulating delay of 5 seconds
            await new Promise(resolve => setTimeout(resolve, 5000));

            const response = await fetch("https://jsonplaceholder.typicode.com/users");

            if (!response.ok) {
                throw new Error("Failed to fetch users");
            }

            const data = await response.json();

            console.log("Data received from API:", data);

            return data;
        } catch (err) {
            console.error("Error while fetching users:", err);
            throw err;
        }
    }

    // Other non-blocking tasks
    console.log("Doing some other tasks while fetching users...");

    for (let i = 0; i <= 3; i++) {
        console.log("Performing some other task while fetching users", i);
    }

    fetchUsers()
        .then(data => {
            console.log("Users data processed:", data);

            let result = "";

            data.forEach(user => {
                result += `<p>User Name: ${user.username} - Email: ${user.email}</p>`;
            });

            document.getElementById("output").innerHTML = result;
        })
        .catch(err => {
            document.getElementById("output").innerHTML =
                `<h3>Error while processing users data: ${err.message}</h3>`;
        });
</script>

</body>
</html>
