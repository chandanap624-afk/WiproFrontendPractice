<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef2f7;
        }

        h2 {
            color: #34495e;
        }

        table {
            background-color: white;
        }

        tbody tr:hover {
            background-color: #f1f1f1; /* hover effect */
        }

        td {
            font-weight: 500;
        }

        .btn-sm {
            padding: 4px 8px;
        }
    </style>
</head>

<body class="container mt-4">

<h2 class="text-center mb-4">Employee Management Dashboard</h2>

<!-- FORM -->
<div class="card p-3 mb-4">
    <h4 id="formTitle">Add Employee</h4>

    <input type="hidden" id="empId">

    <input type="text" id="name" class="form-control mb-2" placeholder="Enter Name">
    <input type="email" id="email" class="form-control mb-2" placeholder="Enter Email">

    <button class="btn btn-primary" onclick="saveEmployee()">Submit</button>
</div>

<!-- TABLE -->
<table class="table table-bordered table-striped">
    <thead class="table-primary">
        <tr>
            <th>Employee Name</th>
            <th>Email Address</th>
            <th>Company Name</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script>

const apiUrl = "https://jsonplaceholder.typicode.com/users";
let employees = [];

// LOAD DATA
async function loadEmployees() {
    try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        employees = data.map(emp => ({
            id: emp.id,
            name: emp.name,
            email: emp.email,
            company: emp.company.name
        }));

        displayEmployees();
    } catch {
        alert("Error loading employees");
    }
}

// DISPLAY (TABLE FORMAT ONLY)
function displayEmployees() {
    document.getElementById("tableBody").innerHTML =
        employees.map(emp => `
        <tr>
            <td> ${emp.name}</td>
            <td> ${emp.email}</td>
            <td> ${emp.company}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editEmployee(${emp.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.id})">Delete</button>
            </td>
        </tr>
    `).join("");
}

// ADD / UPDATE
async function saveEmployee() {
    const id = empId.value;
    const name = nameInput.value;
    const email = emailInput.value;

    if (!name || !email) {
        alert("Enter all fields");
        return;
    }

    if (!id) {
        const newEmp = {
            id: employees.length + 1,
            name,
            email,
            company: "New Company"
        };

        await fetch(apiUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(newEmp)
        });

        employees.push(newEmp);
        alert("Employee Added");
    } else {
        await fetch(`${apiUrl}/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name, email})
        });

        const emp = employees.find(e => e.id == id);
        emp.name = name;
        emp.email = email;

        alert("Employee Updated");
    }

    clearForm();
    displayEmployees();
}

// EDIT
function editEmployee(id) {
    const emp = employees.find(e => e.id == id);

    empId.value = emp.id;
    nameInput.value = emp.name;
    emailInput.value = emp.email;

    formTitle.innerText = "Update Employee";
}

// DELETE
async function deleteEmployee(id) {
    if (!confirm("Delete this employee?")) return;

    await fetch(`${apiUrl}/${id}`, { method: "DELETE" });

    employees = employees.filter(e => e.id != id);

    alert("Employee Deleted");
    displayEmployees();
}

// CLEAR
function clearForm() {
    empId.value = "";
    nameInput.value = "";
    emailInput.value = "";
    formTitle.innerText = "Add Employee";
}

// shortcuts
const empId = document.getElementById("empId");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const formTitle = document.getElementById("formTitle");

// load
loadEmployees();

</script>

</body>
</html>
