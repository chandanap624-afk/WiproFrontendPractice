<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Await Fetch Example</title>
</head>
<body>

<h2>Users Data</h2>
<div id="output"></div>

<script>
    // async function to fetch users
    async function fetchUserAsync() {
        try {
            console.log("Fetching all users data...");

            // fetch data from API
            const response = await fetch("https://jsonplaceholder.typicode.com/users");

            // check response
            if (!response.ok) {
                throw new Error("Failed to fetch data");
            }

            // convert to JSON
            const data = await response.json();

            console.log("Users data:", data);

            // display data in HTML
            let result = "<h3>Users List:</h3>";

            data.forEach(user => {
                result += `<p>${user.name} - ${user.email}</p>`;
            });

            document.getElementById("output").innerHTML = result;

        } catch (error) {
            console.error("Error:", error);
            document.getElementById("output").innerHTML = `<p>${error}</p>`;
        }
    }

    // call function
    fetchUserAsync();

    // this runs immediately (non-blocking)
    console.log("Meanwhile, the rest of the app execution will be running...");
</script>

</body>
</html>
