<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Case Example</title>
</head>
<body>

<script>

// Take input from user
let day = prompt("Enter the value as a day name:");

// Switch case
switch(day)
{
    case "Monday":
        console.log("Today is: " + day);
        break;

    case "Tuesday":
        console.log("Today is: " + day);
        break;

    case "Wednesday":
        console.log("Today is: " + day);
        break;

    default:
        console.log("Invalid day");
}

</script>

</body>
</html>
